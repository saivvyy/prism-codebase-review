<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="tile"><rect width="400" height="400" rx="80" /></clipPath>
  </defs>

  <!-- Tile: GitHub black -->
  <rect width="400" height="400" rx="80" fill="#010409" />

  <g clip-path="url(#tile)">
    <!-- Entering beam: white / gray -->
    <polygon points="-10,160 100,160 100,180 -10,180" fill="#8B949E" opacity="0.3" />
    <polygon points="-10,166 100,166 100,174 -10,174" fill="#F0F6FC" />

    <!-- Exiting rainbow (only color in the logo) -->
    <polygon points="320,148 420,30 420,68 320,156" fill="#FF1F3D" />
    <polygon points="320,156 420,68 420,106 320,163" fill="#FF7A00" />
    <polygon points="320,163 420,106 420,144 320,169" fill="#FFE600" />
    <polygon points="320,169 420,144 420,182 320,175" fill="#00F26B" />
    <polygon points="320,175 420,182 420,220 320,182" fill="#0FA5FF" />
    <polygon points="320,182 420,220 420,258 320,192" fill="#B23CFF" />

    <!-- Solid P base -->
    <path d="M 100 80 L 240 80 A 90 90 0 0 1 240 260 L 160 260 L 160 320 L 100 320 Z M 160 140 L 240 140 A 30 30 0 0 1 240 200 L 160 200 Z" fill="#484F58" fill-rule="evenodd" />

    <!-- Facets: white -> gray -> dark gray (light from top-left) -->
    <!-- Stem -->
    <polygon points="100,80 130,80 130,320 100,320" fill="#C9D1D9" />
    <polygon points="130,80 160,80 160,140 130,110" fill="#8B949E" />
    <polygon points="130,230 160,260 160,320 130,320" fill="#484F58" />

    <!-- Bowl top & bottom bars -->
    <polygon points="160,80 240,80 240,110 130,110" fill="#F0F6FC" />
    <polygon points="160,140 130,110 240,110 240,140" fill="#6E7681" />
    <polygon points="240,200 240,230 130,230 160,200" fill="#B1BAC4" />
    <polygon points="240,230 240,260 160,260 130,230" fill="#484F58" />

    <!-- Bowl outer arc -->
    <path d="M 240 80 A 90 90 0 0 1 330 170 L 300 170 A 60 60 0 0 0 240 110 Z" fill="#E6EDF3" />
    <path d="M 330 170 A 90 90 0 0 1 240 260 L 240 230 A 60 60 0 0 0 300 170 Z" fill="#6E7681" />

    <!-- Bowl inner arc & hole walls -->
    <path d="M 240 140 A 30 30 0 0 1 270 170 L 300 170 A 60 60 0 0 0 240 110 Z" fill="#8B949E" />
    <path d="M 270 170 A 30 30 0 0 1 240 200 L 240 230 A 60 60 0 0 0 300 170 Z" fill="#C9D1D9" />
    <polygon points="130,110 160,140 160,200 130,230" fill="#484F58" />

    <!-- Internal beam: black shadow + white core -->
    <polygon points="100,164 130,167 330,162 330,178 130,173 100,176" fill="#010409" opacity="0.5" />
    <polygon points="100,168 130,169 330,167 330,173 130,171 100,172" fill="#F0F6FC" />
  </g>

  <!-- Gray border so the black tile separates from the GitHub header -->
  <rect x="3" y="3" width="394" height="394" rx="77" fill="none" stroke="#484F58" stroke-width="6" />
</svg>
